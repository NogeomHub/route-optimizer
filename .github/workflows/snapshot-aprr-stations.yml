name: Snapshot APRR stations
on:
  push:
    branches: [feat/v3-generic-aprr-pricing]
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-generic-aprr-pricing
      - name: Fetch named APRR toll booths
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          q='''[out:json][timeout:90];area["ISO3166-1"="FR"][admin_level=2]->.fr;(node["barrier"="toll_booth"]["operator"~"APRR",i](area.fr);way["barrier"="toll_booth"]["operator"~"APRR",i](area.fr););out center tags;'''
          req=urllib.request.Request('https://overpass-api.de/api/interpreter',data=urllib.parse.urlencode({'data':q}).encode(),headers={'User-Agent':'route-optimizer-personal-prototype/0.2'})
          data=json.load(urllib.request.urlopen(req,timeout=120))
          rows=[]
          for e in data['elements']:
            t=e.get('tags',{}); lat=e.get('lat',e.get('center',{}).get('lat')); lon=e.get('lon',e.get('center',{}).get('lon'))
            if lat is None or lon is None or not t.get('name'): continue
            rows.append({'osm_type':e['type'],'osm_id':e['id'],'lat':lat,'lon':lon,'name':t['name'],'operator_ref':t.get('operator:ref'),'highway_ref':t.get('highway:ref')})
          rows.sort(key=lambda r:(r['name'],r['osm_type'],r['osm_id']))
          if len(rows)<150: raise SystemExit(f'Suspicious station count {len(rows)}')
          out={'schema_version':1,'snapshot_date':'2026-11-02','source':'OpenStreetMap contributors via Overpass API','license':'ODbL 1.0','attribution':'© OpenStreetMap contributors','query':q,'booths':rows}
          open('server/pricing/data/osm-aprr-toll-booths.json','w').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print('saved',len(rows))
          PY
      - name: Commit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/snapshot-aprr-stations.yml
          git add server/pricing/data/osm-aprr-toll-booths.json
          git commit -m 'data: snapshot APRR toll booths from OpenStreetMap'
          git push origin HEAD:feat/v3-generic-aprr-pricing