name: Diagnose archived route fixture

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Print archived route metrics
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { gunzipSync } from 'node:zlib';
          import { decode } from './server/src/geometry.mjs';

          const fixture = JSON.parse(
            gunzipSync(readFileSync('./server/test/fixtures/pricing-crans-real.json.gz')),
          );

          function haversineKm(a, b) {
            const R = 6371;
            const toRad = (d) => d * Math.PI / 180;
            const [lon1, lat1] = a;
            const [lon2, lat2] = b;
            const dLat = toRad(lat2 - lat1);
            const dLon = toRad(lon2 - lon1);
            const s = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
            return 2 * R * Math.asin(Math.sqrt(s));
          }

          function geomKm(shape) {
            const c = decode(shape);
            let km = 0;
            for (let i = 1; i < c.length; i++) km += haversineKm(c[i-1], c[i]);
            return { km, points: c.length };
          }

          const rows = fixture.routes.map((r) => {
            const g = geomKm(r.shape);
            return {
              id: r.id,
              storedKm: r.distance ?? r.distanceKm ?? r.km ?? null,
              storedMinutes: r.duration == null ? (r.durationMinutes ?? r.minutes ?? null) : r.duration / 60,
              geometryKm: Math.round(g.km * 10) / 10,
              points: g.points,
            };
          });

          console.log('FIXTURE_ROUTE_METRICS', JSON.stringify(rows, null, 2));
          NODE
