name: Test V3 GPS + TomTom integration

on:
  push:
    branches: [integration/v3-gps-tomtom, fix/v3-eta-ui, fix/v3-eta-all-priced]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:server
      - run: npm run test:netlify
      - run: npm run build:v3:netlify
