name: Test TomTom integration

on:
  push:
    branches: [feat/v3-tomtom-eta]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit archived route identity
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { gunzipSync } from 'node:zlib';
          const fixture = JSON.parse(gunzipSync(readFileSync('server/test/fixtures/pricing-crans-real.json.gz')));
          const ids = new Set(['G004','G007','G014','G021','G028','G025','G022','G001']);
          for (const r of fixture.routes.filter(r => ids.has(r.id))) {
            console.log('ARCHIVE_ROUTE', JSON.stringify({ id:r.id, distanceKm:r.distanceKm, durationSeconds:r.durationSeconds }));
          }
          NODE
      - name: Smoke live TomTom provider with redacted persistence
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { gunzipSync } from 'node:zlib';
          import { HttpClient } from './server/src/providers.mjs';
          import { TomTomEtaProvider } from './server/src/tomtom.mjs';
          if (!process.env.TOMTOM_API_KEY) throw new Error('TOMTOM_API_KEY missing');
          const fixture = JSON.parse(gunzipSync(readFileSync('server/test/fixtures/pricing-crans-real.json.gz')));
          const route = fixture.routes.find(r => r.id === 'G021');
          let recorded;
          const http = new HttpClient({ record: async entry => { recorded = entry; } });
          const provider = new TomTomEtaProvider(http, { apiKey: process.env.TOMTOM_API_KEY });
          const eta = await provider.reassess(route);
          await http.close();
          if (!recorded || JSON.stringify(recorded).includes(process.env.TOMTOM_API_KEY)) throw new Error('TomTom credential reached persistent record');
          if (new URL(recorded.url).searchParams.has('key')) throw new Error('Recorded TomTom URL contains key');
          console.log('TOMTOM_LIVE_SECURE_OK', JSON.stringify({route:'G021', distanceKm:eta.distanceKm, durationMinutes:eta.durationMinutes}));
          NODE
      - run: npm run test:server
      - run: npm run test:netlify
      - run: npm run build:v3:netlify
