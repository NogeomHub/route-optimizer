name: Test TomTom integration

on:
  push:
    branches: [feat/v3-tomtom-eta]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit dependency advisories
        run: |
          npm audit --json > /tmp/audit.json || true
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const audit = JSON.parse(readFileSync('/tmp/audit.json','utf8'));
          console.log('AUDIT_COUNTS', JSON.stringify(audit.metadata?.vulnerabilities ?? {}));
          for (const [name,v] of Object.entries(audit.vulnerabilities ?? {}).filter(([,v]) => ['high','critical'].includes(v.severity))) {
            console.log('AUDIT_ITEM', JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,via:(v.via ?? []).map(x => typeof x === 'string' ? x : {name:x.name,title:x.title,url:x.url,severity:x.severity}),fixAvailable:v.fixAvailable}));
          }
          NODE
      - run: npm run test:server
      - run: npm run test:netlify
      - run: npm run build:v3:netlify
