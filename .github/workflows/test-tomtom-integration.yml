name: Test TomTom integration

on:
  push:
    branches: [feat/v3-tomtom-eta]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:server
      - run: npm run test:netlify
      - run: npm run build:v3:netlify
