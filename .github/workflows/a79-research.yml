name: Inspect archived A79 traversals
on:
  push:
    branches: [feat/v3-a79-pricing]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Summarize A79 portions in archived pricing fixture
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {gunzipSync} from 'node:zlib';
          import {decode} from './server/src/geometry.mjs';
          const fixture=JSON.parse(gunzipSync(readFileSync('./server/test/fixtures/pricing-crans-real.json.gz')));
          const ids=new Set(['G006','G012','G015','G017','G020','G027']);
          const norm=(n)=>String(n??'').replace(/\s/g,'').toUpperCase();
          for(const r of fixture.routes.filter(r=>ids.has(r.id))){
            const pts=decode(r.trace.shape);
            const rows=[];
            for(const [i,e] of r.trace.edges.entries()){
              const names=(e.names??[]).map(String);
              if(!names.some(n=>norm(n)==='A79')) continue;
              rows.push({i,km:e.length,toll:e.toll,names,start:pts[e.begin_shape_index],end:pts[e.end_shape_index]});
            }
            const groups=[];
            for(const e of rows){
              const last=groups.at(-1);
              if(last && e.i===last.last+1){last.last=e.i;last.km+=e.km;last.end=e.end;last.names.push(...e.names);}
              else groups.push({first:e.i,last:e.i,km:e.km,start:e.start,end:e.end,names:[...e.names]});
            }
            console.log('\nROUTE',r.id,'durationMin',(r.durationSeconds/60).toFixed(1),'distanceKm',r.distanceKm);
            for(const [j,g] of groups.entries()) console.log('A79',j+1,JSON.stringify({edges:[g.first,g.last],km:+g.km.toFixed(3),start:g.start,end:g.end,names:[...new Set(g.names)]}));
          }
          NODE