name: Inspect archived A79 traversals
on:
  push:
    branches: [feat/v3-a79-pricing]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Diagnose A79 model matching
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {gunzipSync} from 'node:zlib';
          import {decode} from './server/src/geometry.mjs';
          import {matchTransactions} from './server/pricing/matching.mjs';
          const fixture=JSON.parse(gunzipSync(readFileSync('./server/test/fixtures/pricing-crans-real.json.gz')));
          const base=JSON.parse(readFileSync('./server/pricing/data/models.json'));
          const matching=JSON.parse(readFileSync('./server/pricing/data/aliae-matching-2026.json'));
          const models=base.map(m=>m.free_flow?.operator===matching.operator?{...m,free_flow:{...m.free_flow,...matching}}:m);
          const ids=new Set(['G006','G012','G015','G017','G020','G027']);
          for(const r of fixture.routes.filter(r=>ids.has(r.id))){
            const input={route:{...r,geometry:{type:'LineString',coordinates:decode(r.shape)}},trace:r.trace,origin:fixture.origin,destination:fixture.destination,graph:fixture.graph};
            const hits=models.map(m=>({id:m.id,match:matchTransactions(input,m)})).filter(x=>x.match);
            console.log('\nROUTE',r.id,'MATCHES',hits.length);
            for(const h of hits) console.log(JSON.stringify({model:h.id,transactions:h.match.transactions,unknown:h.match.unknown,coverageComplete:h.match.coverageComplete}));
          }
          NODE