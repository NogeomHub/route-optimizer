name: Diagnose Chalon pricing

on:
  push:
    branches:
      - feat/v3-generic-aprr-pricing
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run tariffs:aprr
      - run: node scripts/diagnose-chalon.mjs
