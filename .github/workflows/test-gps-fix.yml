name: Test GPS corridor fix

on:
  push:
    branches: [fix/gps-full-corridor]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Typecheck and build V3 Netlify
        run: npm run build:v3:netlify

# This workflow intentionally validates only the isolated GPS fix branch.
