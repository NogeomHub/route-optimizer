name: Validate APRR tariff importer
on:
  push:
    branches: [feat/v3-generic-aprr-pricing]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build full APRR matrix from official PDF
        run: |
          npm install --no-save --ignore-scripts pdfjs-dist@5.4.394
          node scripts/build-aprr-matrix.mjs
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const d=JSON.parse(readFileSync('server/pricing/generated/aprr-2026-matrix.json'));
          console.log('rows',Object.keys(d.matrix).length,'sha',d.sourceSha256);
          for(const key of ['PONT D AIN\u0000CHALON SUD','AMBERIEU\u0000CHALON SUD','PONT D AIN\u0000LES EPRUNES']) console.log(key.replace('\u0000',' -> '),d.matrix[key]);
          NODE