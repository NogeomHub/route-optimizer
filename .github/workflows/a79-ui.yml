name: Implement electric toll profile UI
on:
  push:
    branches: [feat/v3-a79-pricing]
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-a79-pricing
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Patch UI
        id: patch
        run: |
          if grep -q 'Tarif de péage' src/v3/V3App.tsx; then echo 'changed=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 <<'PY'
          from pathlib import Path
          def rep(path, old, new):
            p=Path(path); s=p.read_text()
            if old not in s: raise SystemExit(f'pattern missing: {path}')
            p.write_text(s.replace(old,new,1))
          rep('src/v3/provider.ts',
          '''  search(\n    origin: Place,\n    destination: Place,\n  ): Promise<{ jobId: string; status: string; reused: boolean }>;\n''',
          '''  search(\n    origin: Place,\n    destination: Place,\n    profile?: "standard" | "vtfe",\n  ): Promise<{ jobId: string; status: string; reused: boolean }>;\n''')
          rep('src/v3/provider.ts',
          '''  search: (origin, destination) =>\n    request("/api/search", { origin, destination }),\n''',
          '''  search: (origin, destination, profile = "standard") =>\n    request("/api/search", { origin, destination, parameters: { profile } }),\n''')
          rep('src/v3/V3App.tsx',
          '''  const [minimumSaving, setMinimumSaving] = useState(0);\n''',
          '''  const [minimumSaving, setMinimumSaving] = useState(0);\n  const [tollProfile, setTollProfile] = useState<"standard" | "vtfe">(\n    () =>\n      localStorage.getItem("v3-toll-profile") === "vtfe" ? "vtfe" : "standard",\n  );\n''')
          rep('src/v3/V3App.tsx',
          '''      const result = await provider.search(origin.place, destination.place);\n''',
          '''      const result = await provider.search(\n        origin.place,\n        destination.place,\n        tollProfile,\n      );\n''')
          rep('src/v3/V3App.tsx',
          '''            <button\n              className="v3-primary"\n''',
          '''            <label>\n              Tarif de péage\n              <select\n                aria-label="Profil tarifaire de péage"\n                value={tollProfile}\n                disabled={launching || active}\n                onChange={(e) => {\n                  const value = e.target.value === "vtfe" ? "vtfe" : "standard";\n                  setTollProfile(value);\n                  localStorage.setItem("v3-toll-profile", value);\n                }}\n              >\n                <option value="standard">Véhicule thermique / hybride</option>\n                <option value="vtfe">100 % électrique · Crit’Air 0</option>\n              </select>\n              <small>\n                Le profil électrique applique le tarif VTFE lorsqu’un opérateur\n                le prévoit, notamment sur l’A79.\n              </small>\n            </label>\n            <button\n              className="v3-primary"\n''')
          rep('src/v3/v3.css',
          '''.v3-shell input {\n''',
          '''.v3-shell input,\n.v3-shell select {\n''')
          rep('src/v3/v3.css',
          '''  grid-template-columns: 1fr 1fr auto;\n''',
          '''  grid-template-columns: 1fr 1fr 1fr auto;\n''')
          PY
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Validate
        if: steps.patch.outputs.changed == 'true'
        run: |
          npm ci
          npm test
          npm run test:server
          npm run test:netlify
          npm run build:v3:netlify
      - name: Commit
        if: steps.patch.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/v3
          git commit -m 'feat: expose electric toll tariff profile'
          git push origin HEAD:feat/v3-a79-pricing