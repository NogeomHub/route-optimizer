name: Finalize generic APRR pricing
on:
  push:
    branches: [feat/v3-generic-aprr-pricing]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-generic-aprr-pricing
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install build-time PDF parser
        run: npm install --save-dev pdfjs-dist@5.4.394
      - name: Snapshot APRR toll stations from OpenStreetMap
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, time
          q='''[out:json][timeout:45];(node["barrier"="toll_booth"]["operator"~"APRR",i];way["barrier"="toll_booth"]["operator"~"APRR",i];);out center tags;'''
          body=urllib.parse.urlencode({'data':q}).encode(); data=None
          for base in ['https://overpass.kumi.systems/api/interpreter','https://overpass-api.de/api/interpreter','https://overpass.nchc.org.tw/api/interpreter']:
            try:
              req=urllib.request.Request(base,data=body,headers={'User-Agent':'route-optimizer-personal-prototype/0.2'})
              data=json.load(urllib.request.urlopen(req,timeout=75)); break
            except Exception as e: print('Overpass retry:',e); time.sleep(2)
          if data is None: raise SystemExit('No Overpass endpoint available')
          rows=[]
          for e in data['elements']:
            t=e.get('tags',{}); lat=e.get('lat',e.get('center',{}).get('lat')); lon=e.get('lon',e.get('center',{}).get('lon'))
            if lat is None or lon is None or not t.get('name') or not (41 <= lat <= 52 and -6 <= lon <= 10): continue
            rows.append({'osm_type':e['type'],'osm_id':e['id'],'lat':lat,'lon':lon,'name':t.get('name'),'operator_ref':t.get('operator:ref'),'highway_ref':t.get('highway:ref')})
          rows.sort(key=lambda r:(r['name'],r['osm_type'],r['osm_id']))
          if len(rows) < 150: raise SystemExit(f'Suspicious APRR booth snapshot: {len(rows)}')
          out={'schema_version':1,'snapshot_date':'2026-11-02','source':'OpenStreetMap contributors via Overpass API','license':'ODbL 1.0','attribution':'© OpenStreetMap contributors','query':q,'booths':rows}
          open('server/pricing/data/osm-aprr-toll-booths.json','w').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print('saved',len(rows),'named APRR toll-booth objects')
          PY
      - name: Integrate generic APRR source
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path
          p=Path('server/pricing/provider.mjs'); s=p.read_text()
          def rep(old,new):
            global s
            if old not in s: raise SystemExit('provider patch anchor missing: '+old[:50])
            s=s.replace(old,new,1)
          old='import { matchTransactions } from "./matching.mjs";\n'
          rep(old,old+'import {\n  loadGeneratedAprr,\n  loadAprrBooths,\n  matchGenericAprrTransactions,\n  normalizeStation,\n} from "./generic-aprr.mjs";\n')
          rep('''    models = null,\n    catalogs = null,\n  } = {}) {\n''','''    models = null,\n    catalogs = null,\n    aprrMatrix = undefined,\n    aprrBooths = undefined,\n  } = {}) {\n''')
          rep('''    this.models = models;\n    this.catalogs = catalogs.map(validateCatalog);\n    this.revision = hash({\n''','''    this.models = models;\n    this.catalogs = catalogs.map(validateCatalog);\n    this.aprrMatrix = aprrMatrix === undefined ? loadGeneratedAprr(resourceRoot) : aprrMatrix;\n    this.aprrBooths = aprrBooths === undefined ? loadAprrBooths(resourceRoot) : aprrBooths;\n    this.revision = hash({\n''')
          rep('''      models,\n      catalogs,\n      engine: readFileSync(new URL("provider.mjs", resourceRoot), "utf8"),\n''','''      models,\n      catalogs,\n      aprrMatrixSha256: this.aprrMatrix?.sourceSha256 ?? null,\n      aprrBoothCount: this.aprrBooths?.booths?.length ?? 0,\n      engine: readFileSync(new URL("provider.mjs", resourceRoot), "utf8"),\n''')
          rep('''    if (t.mappingConfidence !== "reviewed")\n      return { ...base, reason: "AMBIGUOUS_MATCH" };\n    const applicable = [],\n''','''    if (t.mappingConfidence !== "reviewed")\n      return { ...base, reason: "AMBIGUOUS_MATCH" };\n    if (\n      t.tariffSource === "generated_aprr_matrix" &&\n      t.operator === "APRR" &&\n      this.aprrMatrix &&\n      vehicleClass === 1 &&\n      ["standard", "vtfe"].includes(profile) &&\n      ["closed", "open"].includes(t.system)\n    ) {\n      const entry = normalizeStation(t.entry), exit = normalizeStation(t.exit), key = `${entry}\\u0000${exit}`, cell = this.aprrMatrix.matrix[key];\n      if (cell) {\n        const generatedSource = { catalogId: "APRR-2026-generated-at-build", ruleId: key, source: { url: this.aprrMatrix.sourceUrl, sha256: this.aprrMatrix.sourceSha256, locator: `physical PDF page ${cell.page}, Classe 1, ${entry} → ${exit}` }, effectiveFrom: this.aprrMatrix.effectiveFrom, effectiveUntil: null, sourceVerifiedAt: "2026-11-02", verificationDue: on >= "2027-01-28", validityReviewFrom: "2027-02-01", replacedFrom: null, vehicleClass: 1, profile: "standard" };\n        if (on < this.aprrMatrix.effectiveFrom) return { ...base, ...generatedSource, reason: "TARIFF_NOT_YET_EFFECTIVE" };\n        if (on >= "2027-02-01") return { ...base, ...generatedSource, status: "stale", reason: "VALIDITY_REVIEW_REQUIRED" };\n        return { ...base, ...generatedSource, cents: cell.cents, status: "verified", reason: null };\n      }\n    }\n    const tariffProfile = t.operator === "ALIAE" ? profile : "standard";\n    const applicable = [],\n''')
          rep('''          r.profile !== profile ||\n''','''          r.profile !== tariffProfile ||\n''')
          rep('''      matches = this.models\n        .map((m) => matchTransactions(input, m))\n        .filter(Boolean);\n''','''      matches = this.models\n        .map((m) => matchTransactions(input, m))\n        .filter(Boolean);\n      if (!matches.length && this.aprrMatrix && this.aprrBooths) {\n        const generic = matchGenericAprrTransactions(input, this.aprrMatrix, this.aprrBooths);\n        if (generic) matches = [generic];\n      }\n''')
          p.write_text(s)
          p=Path('package.json'); pkg=json.loads(p.read_text())
          pkg['scripts']['tariffs:aprr']='node scripts/build-aprr-matrix.mjs'
          pkg['scripts']['build:v3:netlify']='npm run tariffs:aprr && tsc -b && vite build --mode netlify'
          p.write_text(json.dumps(pkg,indent=2,ensure_ascii=False)+'\n')
          PY
      - name: Add generated-source regression tests
        run: |
          cat > server/test/generic-aprr.test.mjs <<'NODE'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import {AuditedTollPricingProvider} from '../pricing/provider.mjs';
          import {resolveOfficialStation} from '../pricing/generic-aprr.mjs';
          test('OSM station names resolve conservatively to official APRR names',()=>{
            const names=['PONT D AIN','CHALON SUD','AMBERIEU'];
            assert.equal(resolveOfficialStation("Pont-d'Ain",names),'PONT D AIN');
            assert.equal(resolveOfficialStation('Ambérieu-en-Bugey',names),'AMBERIEU');
            assert.equal(resolveOfficialStation('Unrelated Plaza',names),null);
          });
          test('generated APRR matrix prices Pont d Ain to Chalon Sud without changing audited corridor quotes',()=>{
            const provider=new AuditedTollPricingProvider();
            const q=provider.quote({operator:'APRR',system:'closed',entry:"Pont d'Ain",exit:'Chalon Sud',mappingConfidence:'reviewed',tariffSource:'generated_aprr_matrix',evidence:[]},{on:'2026-11-02',vehicleClass:1,profile:'standard'});
            assert.equal(q.status,'verified');
            assert.equal(q.cents,1070);
            const audited=provider.quote({operator:'APRR',system:'closed',entry:'AMBERIEU',exit:'LES EPRUNES',mappingConfidence:'reviewed',evidence:[]},{on:'2026-10-30',vehicleClass:1,profile:'standard'});
            assert.equal(audited.cents,4070);
            assert.equal(audited.sourceVerifiedAt,'2026-10-30');
          });
          NODE
      - name: Build tariffs and validate all layers
        run: |
          npm run tariffs:aprr
          npm test
          npm run test:server
          npm run test:netlify
          npm run build:v3:netlify
      - name: Commit validated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/generic-aprr-finalize.yml
          git add package.json package-lock.json server/pricing/provider.mjs server/pricing/generic-aprr.mjs server/pricing/data/osm-aprr-toll-booths.json server/test/generic-aprr.test.mjs scripts/build-aprr-matrix.mjs .gitignore
          git commit -m 'feat: generalize APRR class-1 toll pricing from official matrix'
          git push origin HEAD:feat/v3-generic-aprr-pricing