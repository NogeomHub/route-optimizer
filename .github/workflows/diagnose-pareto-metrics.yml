name: Diagnose Pareto route metrics

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Print Pareto metrics
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { gunzipSync } from 'node:zlib';
          import { AuditedTollPricingProvider } from './server/pricing/provider.mjs';
          import { decode } from './server/src/geometry.mjs';

          const fixture = JSON.parse(gunzipSync(readFileSync('./server/test/fixtures/pricing-crans-real.json.gz')));
          const ids = ['G004','G007','G014','G021','G028','G025','G022','G001'];
          const provider = new AuditedTollPricingProvider();
          const rows = [];
          for (const id of ids) {
            const r = fixture.routes.find((x) => x.id === id);
            const pricing = await provider.priceRoute({
              route: { ...r, geometry: { type: 'LineString', coordinates: decode(r.shape) } },
              trace: r.trace,
              origin: fixture.origin,
              destination: fixture.destination,
              on: '2026-10-30',
              vehicleClass: 1,
            });
            rows.push({ id, minutes: Math.round((r.durationSeconds/60)*10)/10, km: Math.round(r.distanceKm*10)/10, toll: pricing.totalCents == null ? null : pricing.totalCents/100, status: pricing.status });
          }
          console.log('PARETO_METRICS', JSON.stringify(rows, null, 2));
          NODE
