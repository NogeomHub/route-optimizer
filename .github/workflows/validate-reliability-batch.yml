name: Validate reliability batch

on:
  push:
    branches:
      - chore/vitest-5

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:server
      - run: npm run test:netlify
      - run: npm run build:v3:netlify
