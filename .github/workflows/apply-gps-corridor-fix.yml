name: Apply GPS corridor fix

on:
  push:
    branches:
      - fix-gps-full-corridor-work

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-gps-full-corridor-work
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply patch
        run: python3 scripts/apply_gps_corridor_fix.py
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build V3 Netlify
        run: npm run build:v3:netlify
      - name: Print G021 anchor evidence
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import zlib from 'node:zlib';
          import { corridorCandidates } from './server/src/gps.mjs';
          import { decode } from './server/src/geometry.mjs';
          const routes = JSON.parse(zlib.gunzipSync(fs.readFileSync('./server/test/fixtures/pricing-crans-real.json.gz')));
          const facts = JSON.parse(fs.readFileSync('./server/test/fixtures/gps-crans-evidence.json', 'utf8'));
          const selected = routes.routes.find((r) => r.id === 'G021');
          const reference = routes.routes.find((r) => r.id === 'G004');
          for (const e of facts.traceNames) selected.trace.edges[e.index].names = e.names;
          const geometry = (r) => ({ type: 'LineString', coordinates: decode(r.shape) });
          const a = corridorCandidates(geometry(selected), geometry(reference), facts.maneuvers, selected.trace);
          console.log(JSON.stringify(a.groups.map((g) => g[0]).map((x) => ({
            routeKm: x.routeKm,
            separationKm: x.separationKm,
            point: x.point,
            roads: x.roads,
            zoneStartKm: x.zoneStartKm,
            zoneEndKm: x.zoneEndKm
          })), null, 2));
          NODE
      - name: Commit tested fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/gps.mjs server/test/gps.test.mjs
          git commit -m "fix(v3): guide GPS across the full divergent corridor"
          git push origin HEAD:fix-gps-full-corridor-work
